<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F766E'/%3E%3Crect x='9' y='8' width='14' height='3' rx='1.5' fill='white'/%3E%3Crect x='9' y='14.5' width='14' height='3' rx='1.5' fill='white' opacity='.8'/%3E%3Crect x='9' y='21' width='9' height='3' rx='1.5' fill='white' opacity='.6'/%3E%3C/svg%3E"
    />
    <title>RAG 知识库</title>
    <script>
      // 在首帧前应用主题，避免深色模式下闪白
      try {
        var t = localStorage.getItem('rag-theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
