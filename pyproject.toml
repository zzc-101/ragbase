# Linux（CI）用 PyTorch 官方 CPU 源：PyPI 上的 Linux torch 会连带装 nvidia-* / triton 等数 GB 的 CUDA 包。
# macOS 继续用 PyPI 的 torch（带 MPS）。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
