[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ragbase"
version = "0.1.0"
description = "面向中文 PDF / Word / Markdown / 文本资料的本地 RAG 知识库：混合检索 + 精排、问答 / 对话 Agent、HTTP 服务与评测"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.3.14",
    "langgraph==1.2.10",
    "langchain-openai==1.4.1",
    "langchain-text-splitters==1.1.2",
    "chromadb==1.5.9",
    "pymupdf==1.28.0",
    "docx2txt==0.9",
    "python-dotenv==1.2.2",
    "ragas==0.4.3",
    "sentence-transformers==5.6.1",
    "transformers==5.14.1",
    "jieba==0.42.1",
    "bm25s==0.3.13",
    "fastapi==0.143.2",
    "uvicorn[standard]==0.52.0",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "qdrant-client==1.19.1",
]

[project.scripts]
ragbase = "ragbase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragbase"]
# 前端构建产物由 scripts/build_web.sh 复制到 src/ragbase/web/dist（已在 .gitignore 里，所以要用 artifacts 显式带上）；
# 目录不存在（没构建过前端）时这条规则什么也不匹配，wheel 照常构建、只是不含界面。
artifacts = ["src/ragbase/web/dist/**"]

# ---- uv ----------------------------------------------------------------------------------------
[tool.uv]
# 直接依赖在上面已精确钉死；这里把原 requirements.lock（macOS 上 uv pip compile 的结果）里的传递依赖版本
# 也作为约束保留，使迁移到 uv.lock 后所有传递依赖版本保持不变。约束只限制版本，不会额外引入依赖。
