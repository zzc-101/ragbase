name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支 / PR 上有新提交时取消还在跑的旧任务，省分钟数（私有仓库按分钟计费）
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    # 私有仓库 macOS 分钟数贵 10 倍，用 Linux；uv.lock 在 macOS 上生成，但它是跨平台锁（pyproject.toml 里 torch 在 Linux 上指向 PyTorch CPU 源）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_VERSION: "3.12"
      RAG_DEVICE: cpu               # 测试不加载模型，但保证即使解析 auto 也不去探测 GPU
      HF_HUB_OFFLINE: "1"           # 测试不需要、也不允许联网下载模型
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv（缓存下载的 wheel）
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # PyPI 上的 Linux torch 会连带装 ~19 个 CUDA 包（nvidia-*、triton，数 GB）；
      # pyproject.toml 的 [tool.uv.sources] 让 Linux 上的 torch 走 PyTorch 官方 CPU 源（torch==2.13.0+cpu），uv.lock 里已锁定。
      - name: 安装依赖（按 uv.lock，CPU 版 torch）
        run: |
          uv sync --locked
          uv pip check

      - name: 运行全部测试
        # 测试只用本地桩 / 假流水线：不需要模型、.env、真实文档或外网（只访问 127.0.0.1 的 LLM 桩服务）
        run: uv run --locked python tests/run_all.py

  web:
    # 前端只做类型检查 + 打包 + lint（不跑浏览器测试）；与后端测试互不依赖，并行执行
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm（版本取自 web/package.json 的 packageManager）
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查 + 构建
        run: pnpm build

      - name: Lint
        run: pnpm lint
